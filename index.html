<h1>AI技術を1分で 動画運用</h1>
<p>このアプリは、運営者が自分の YouTube チャンネルに動画を投稿・管理するための個人用ツールです。一般の方に向けたサービスではありません。</p>

<h2>できること</h2>
<ul>
  <li>運営者が作った動画を、運営者自身の YouTube チャンネルにアップロードする</li>
  <li>公開日時の予約、字幕・サムネイル・説明文の設定をする</li>
  <li>投稿した動画の状態（公開状況など）を確認する</li>
</ul>

<h2>使用する Google のデータ</h2>
<p>YouTube Data API を使い、運営者が許可した YouTube チャンネルの情報と動画だけを扱います。詳しくは<a href="privacy.html">プライバシーポリシー</a>をご覧ください。</p>
</body>
